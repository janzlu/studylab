<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>研习 · 正弦型函数</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="nav" id="top">
    <a class="brand" href="#top">研习</a>
    <div class="nav-right">
      <nav class="nav-links" aria-label="页内">
        <a class="nav-link" href="#beats">讲解</a>
        <a class="nav-link" href="#checks">自测</a>
      </nav>
      <button type="button" class="btn btn-primary" id="nav-generate">生成讲解</button>
    </div>
  </header>

  <main class="wrap">
    <section class="stage-grid">
      <div class="lesson-col">
        <div class="concept-switch" role="tablist" aria-label="知识点">
          <button type="button" id="concept-sinusoid" role="tab" aria-selected="true">正弦型函数</button>
          <button type="button" id="concept-quadratic" role="tab" aria-selected="false">二次函数</button>
          <button type="button" id="concept-logarithm" role="tab" aria-selected="false">对数函数</button>
          <button type="button" id="concept-exponential" role="tab" aria-selected="false">指数函数</button>
          <button type="button" id="concept-trig" role="tab" aria-selected="false">三角函数</button>
        </div>
        <h1 id="lesson-title">正弦型函数</h1>
        <p class="formula" id="formula">y = A sin(ωx + φ)</p>
        <p class="lead" id="lead">改一个参数，先想图像会怎么变，再看单位圆和波形。</p>
        <p class="parameter-note" id="parameter-note" hidden></p>

        <div class="card upload" id="upload">
          <input class="file-input" id="file" type="file" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp">
          <button type="button" class="upload-hit" id="pick">
            <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
              <path d="M12 16V6M8.5 9.5 12 6l3.5 3.5M5 16.5V19h14v-2.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span id="upload-label">放入教材或课件的印刷体截图</span>
            <span id="reselect" hidden>重新选择</span>
          </button>
          <p class="upload-error" id="upload-error" hidden></p>
        </div>

        <button type="button" class="btn btn-primary" id="generate">
          <span id="generate-label">生成讲解</span>
        </button>

        <div class="followup" id="followup" hidden>
          <p id="followup-text"></p>
          <div class="followup-actions" id="followup-actions">
            <button type="button" class="btn btn-primary" id="confirm-yes">是，按这个知识点生成</button>
            <button type="button" class="btn" id="confirm-no">不是，先不生成</button>
          </div>
        </div>
      </div>

      <div class="anim-col">
        <div class="card anim" id="anim" tabindex="0">
          <canvas id="stage" width="800" height="500" aria-label="单位圆与正弦波形"></canvas>
          <div class="readout" aria-live="polite">
            <span id="readout-formula">y = A sin(ωx + φ)</span>
            <span id="readout-period">T = 2π</span>
          </div>
          <div class="transport" role="group" aria-label="播放控制">
            <button type="button" class="btn" id="play">
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M5 3.2 12.2 8 5 12.8Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
              播放
            </button>
            <button type="button" class="btn" id="pause">
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M5.5 3.5v9M10.5 3.5v9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              暂停
            </button>
            <button type="button" class="btn" id="replay">
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3.2 8a4.8 4.8 0 1 0 1.1-3.1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M3.1 2.8v3.1h3.1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              重播
            </button>
          </div>
          <div class="sliders" id="sliders"></div>
          <p class="caption" id="caption" aria-live="polite"></p>
        </div>
      </div>
    </section>

    <section class="panel" id="beats">
      <h2>讲解</h2>
      <div class="beat-list" id="beat-list"></div>
    </section>

    <section class="panel" id="checks">
      <h2>自测</h2>
      <p class="check-scope">自测按这节课生成时的参数出题，不随滑杆改变。</p>
      <p class="banner" id="check-banner" hidden></p>
      <form id="check-form">
        <div id="check-list"></div>
        <button type="submit" class="btn btn-primary" id="submit-check">交卷</button>
      </form>
    </section>
  </main>

  <noscript><p class="noscript">需要启用 JavaScript 才能播放讲解。</p></noscript>
  <script src="narration.js"></script>
  <script src="sinusoid.js"></script>
  <script src="quadratic.js"></script>
  <script src="logarithm.js"></script>
  <script src="exponential.js"></script>
  <script src="trig.js"></script>
  <script src="app.js"></script>
</body>
</html>
